name: AgentOps Rubric Tests & Golden Evaluation CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-evaluate:
    name: Pytest 19-Criterion Matrix & Golden Dataset Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check all Python packages
        run: python -m compileall -q pokesell_agent eval tests

      - name: Run 95-Point AgentOps Rubric & Web Security Test Suite
        run: pytest -v

      - name: Run Automated Golden Dataset Regression Evaluation Suite
        run: python -m eval.run_evaluation
